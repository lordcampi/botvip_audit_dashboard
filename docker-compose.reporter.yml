services:\n  reporter:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    image: botvip-daily-ai-reporter:latest\n    container_name: botvip-daily-ai-reporter-runner\n    environment:\n      DB_PATH: /data/trading_bot.db\n    volumes:\n      - ./reports:/app/reports\n      - ./logs:/app/logs\n      - /opt/botvip/data/trading_bot.db:/data/trading_bot.db:ro\n    command: ["python", "automation/run_daily_ai_report.py", "--window", "daily", "--output", "reports", "--max-ai-chars", "120000"]\n    restart: "no"\n
